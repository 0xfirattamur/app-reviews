name: Feature request
description: Propose a focused addition or contract change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done with the current public API?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interface
      description: Show the smallest caller-facing example you have in mind.
      render: python
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - Additive
        - Potentially breaking
        - Unsure
    validations:
      required: true
