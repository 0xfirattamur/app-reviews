[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "app-reviews"
version = "1.0.0"
description = "Typed sync and async Python client for App Store and Google Play reviews, app search, metadata, and resumable cursors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Firat Tamur" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "app-store",
    "google-play",
    "app-reviews",
    "reviews",
    "review-scraper",
    "app-store-connect",
    "google-play-developer-api",
    "aso",
    "itunes",
    "httpx",
    "asyncio",
]
dependencies = [
    # Ranges, not pins. A library's `==` becomes every consumer's `==`: when a
    # CVE lands in either of these, an application depending on app-reviews
    # cannot take the patch until app-reviews cuts a release, and pip either
    # hard-conflicts or resolves the whole environment onto the vulnerable
    # version. Exact versions still live in uv.lock, which is what CI installs,
    # so reproducibility is unaffected.
    #
    # Compatibility is enforced by the suite rather than speculative upper
    # caps. In particular, test_http.py freezes the redirect behavior this
    # package relies on (Authorization must be dropped on an origin change).
    "cryptography>=49",
    "httpx>=0.28,<2",
]

[project.urls]
Homepage = "https://github.com/0xfirattamur/app-reviews"
Documentation = "https://0xfirattamur.github.io/app-reviews/"
Changelog = "https://github.com/0xfirattamur/app-reviews/blob/main/CHANGELOG.md"
Repository = "https://github.com/0xfirattamur/app-reviews"
Issues = "https://github.com/0xfirattamur/app-reviews/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/app_reviews"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/release-notes",
    "/docs",
    "/scripts",
    "/src",
    "/tests",
    "/.pre-commit-config.yaml",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/SECURITY.md",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "/.cache",
    "/.coverage*",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/dist",
    "/site",
    "**/__pycache__",
    "**/*.py[cod]",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "mypy==2.3.1",
    "ruff==0.16.3",
    "pre-commit==4.6.2",
    "mkdocs-material[imaging]>=9.7.7,<10",
    "mkdocs-llmstxt>=0.5,<0.6",
]
release = [
    "check-wheel-contents==0.6.3",
    "hatchling==1.32.4",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app_reviews"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: live E2E tests that hit real store endpoints (skipped by default)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app_reviews"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
