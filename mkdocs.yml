site_name: App Reviews
site_description: Typed sync and async Python client for App Store and Google Play reviews, app search, metadata, and resumable cursors
site_url: https://0xfirattamur.github.io/app-reviews/
repo_url: https://github.com/0xfirattamur/app-reviews
repo_name: 0xfirattamur/app-reviews

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - tables
  - attr_list

plugins:
  - search
  - social:
      enabled: !ENV [ENABLE_SOCIAL_CARDS, false]
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Typed Python APIs for bounded Apple App Store and Google Play review
        ingestion, app search, metadata lookup, and resumable pagination.
      sections:
        Getting started:
          - index.md
          - getting-started/*.md
        Guides and reference:
          - guide/*.md
          - reference/*.md
        Project:
          - comparison.md
          - faq.md
          - changelog.md
          - contributing.md

nav:
  - Home: index.md
  - Comparison: comparison.md
  - FAQ: faq.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Guide:
      - Python API: guide/python-api.md
      - Paging and Cursors: guide/paging.md
      - Async: guide/async.md
      - Authentication: guide/authentication.md
  - Reference:
      - Models: reference/models.md
      - Source Capabilities: reference/capabilities.md
      - How It Works: reference/how-it-works.md
  - Changelog: changelog.md
  - Contributing: contributing.md
